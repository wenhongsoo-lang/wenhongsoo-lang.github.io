<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KrispyPotatoes</title>
<meta name="description" content="KrispyPotatoes, maker of Load Path, a bridge-building game for Android.">
<style>
  :root { --bg: #f7f3ea; --text: #23272b; --muted: #5d646b; --rule: #ddd4c2; --accent: #b4572b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1f22; --text: #ece4d6; --muted: #a9a294; --rule: #3a3f44; --accent: #f2b33d; }
  }
  html { background: var(--bg); }
  body { margin: 0 auto; max-width: 42rem; padding: 2.5rem 1rem 4rem; color: var(--text); background: var(--bg);
         font: 17px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 .4rem; }
  h2 { font-size: 1.15rem; margin: 2.2rem 0 .4rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); }
  .meta { color: var(--muted); font-size: .95rem; margin: 0 0 1.8rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<h1>KrispyPotatoes</h1>
<p class="meta">Small games for Android.</p>

<h2>Load Path</h2>
<p>A bridge-building game: design a bridge, run the load test, and see whether it holds.</p>
<p><a href="https://play.google.com/store/apps/details?id=com.loadpath.game">Load Path on Google Play</a> · <a href="https://wenhongsoo-lang.github.io/loadpath-privacy/">Privacy policy</a></p>
</body>
</html>
